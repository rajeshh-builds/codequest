services:
  - type: web
    name: codequest
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: CQ_DB_URL
        fromDatabase:
          name: codequest-db
          property: connectionString
      - key: CQ_DB_USER
        fromDatabase:
          name: codequest-db
          property: user
      - key: CQ_DB_PASSWORD
        fromDatabase:
          name: codequest-db
          property: password

databases:
  - name: codequest-db
    databaseName: codequest_db
    user: root
    plan: free
