services:
  db:
    image: mysql:8.0
    container_name: codequest-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: codequest_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    build: .
    container_name: codequest-web
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      CQ_DB_URL: "jdbc:mysql://db:3306/codequest_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      CQ_DB_USER: "root"
      CQ_DB_PASSWORD: "root"

volumes:
  db_data:
